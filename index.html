<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LA FEST.</title>

  <style>
    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Arial', sans-serif;
    }

    /* BODY */
    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      color: white;
      background: url('NatarajaFINAL.jpeg') no-repeat center center / cover;

      /* CRT flicker */
      animation: crtFlicker 4s infinite;
    }

    /* SCANLINES */
    body::after {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;

      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.02) 0px,
        rgba(0,0,0,0.05) 2px,
        rgba(0,0,0,0.1) 4px
      );

      pointer-events: none;
    }

    /* WRAPPER */
    .nakuldinakar {
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    /* CENTER CONTENT */
    .main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    /* FONT */
    @font-face {
      font-family: 'Panchang';
      src: url("Panchang-Regular.woff") format("woff");
      font-style: bold;
    }

    /* HEADING */
    .main h2 {
      position: relative;

      font-family: 'Panchang';
      font-size: 48px;
      letter-spacing: 3px;
      margin-bottom: 20px;

      background-image:
        linear-gradient(
          to bottom,
          hsl(239, 70%, 10%) 5%,
          hsl(235, 89%, 40%) 50%,
          hsl(236, 84%, 20%) 80%
        ),
        linear-gradient(to bottom, #6f7cff, #040F7B, #02074a);

      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;

      text-shadow:
        0 0 3px rgba(111, 124, 255, 0.5),
        0 0 6px rgba(44, 59, 243, 0.4),
        0 0 10px rgba(15, 25, 175, 0.3);

      filter: contrast(1.1) brightness(1.1);
    }

    /* GLOSS */
    .main h2::before {
      content: "COMING SOON.";
      position: absolute;
      top: 0;
      left: 0;

      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0.5),
        rgba(255,255,255,0.1),
        transparent
      );

      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;

      transform: translateY(-1px);
      opacity: 0.5;
      pointer-events: none;
    }

    /* FOOTER */
    footer {
      padding: 15px;
      text-align: center;
      font-size: 14px;
      color: #888;
    }

    /* CRT FLICKER */
    @keyframes crtFlicker {
      0%   { opacity: 1; }
      2%   { opacity: 0.96; }
      4%   { opacity: 1; }
      8%   { opacity: 0.94; }
      10%  { opacity: 1; }
      50%  { opacity: 0.98; }
      100% { opacity: 1; }
    }

  </style>
</head>

<body>
  <div class="nakuldinakar">

    <div class="main">
      <h2>COMING SOON.</h2>
    </div>

    <footer>
      © ALL RIGHTS RESERVED JESSE '27
    </footer>

  </div>
</body>
</html>
